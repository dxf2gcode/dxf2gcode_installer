[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dxf2gcode"
dynamic = ["version"]
description = "2D drawings to CNC machine compatible G-Code converter."
readme = {file = "README.txt", content-type = "text/plain"}
requires-python = ">=3.9"
license = "GPL-3.0-or-later"
license-files = ["COPYING"]
authors = [
    {name = "Christian Kohloeffel", email = "christian.kohloeffel@googlemail.com"},
]
dependencies = [
    "configobj>=5.0.6",
    "PyQt5>=5.15",
    "PyOpenGL>=3.1",
]

[project.optional-dependencies]
qt6 = ["PyQt6"]

[project.urls]
Homepage = "https://sourceforge.net/p/dxf2gcode/wiki/Home/"

[project.scripts]
dxf2gcode = "dxf2gcode.bootstrap.launcher:main"

[tool.setuptools.dynamic]
version = {attr = "dxf2gcode._version.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["dxf2gcode", "dxf2gcode.*"]
namespaces = true
exclude = ["*.__pycache__"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.cmdclass]
build_py = "tools.build.setuptools_commands.BuildPy"
sdist = "tools.build.setuptools_commands.SourceDistribution"

[tool.setuptools.package-data]
dxf2gcode = [
    "_build_metadata.json",
    "presentation/qt/resources/*.ui",
    "presentation/qt/resources/*.qrc",
    "presentation/qt/resources/images/*.svg",
    "presentation/qt/resources/images/*.png",
    "presentation/qt/resources/images/*.ico",
    "presentation/qt/resources/images/*.icns",
]

[tool.setuptools.data-files]
"share/metainfo" = ["dxf2gcode.appdata.xml"]
"share/applications" = ["dxf2gcode.desktop"]
"share/icons/hicolor/scalable/apps" = [
    "dxf2gcode/presentation/qt/resources/images/dxf2gcode.svg",
]
